name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uletay-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    env:
      NODE_VERSION: '24'
      DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/var/www/uletay' }}
      LE_EMAIL: ${{ vars.LE_EMAIL || secrets.LE_EMAIL }}
      SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      CMS_PORT: ${{ vars.CMS_PORT || secrets.CMS_PORT || '3000' }}
      ADMIN_USER: ${{ vars.ADMIN_USER || secrets.ADMIN_USER || 'admin' }}
      DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT || '3306' }}
      VK_APP_ID: ${{ vars.VK_APP_ID }}
      VK_REDIRECT_URI: ${{ vars.VK_REDIRECT_URI }}
      DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
      DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      EXPO_PUBLIC_API_URL: https://${{ vars.DOMAIN || secrets.DOMAIN }}/api
      EXPO_PUBLIC_SITE_URL: https://${{ vars.DOMAIN || secrets.DOMAIN }}
      EXPO_PUBLIC_YANDEX_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_YANDEX_MAPS_API_KEY || secrets.EXPO_PUBLIC_YANDEX_MAPS_API_KEY }}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_YANDEX_MAPS_API_KEY || vars.EXPO_PUBLIC_YANDEX_MAPS_API_KEY || secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY || secrets.EXPO_PUBLIC_YANDEX_MAPS_API_KEY }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_PROXY_URL: ${{ secrets.LASTFM_PROXY_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || secrets.VAPID_SUBJECT }}
      EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
      RUSTORE_PUSH_PROJECT_ID: ${{ vars.RUSTORE_PUSH_PROJECT_ID }}
      RUSTORE_PUSH_SERVICE_TOKEN: ${{ secrets.RUSTORE_PUSH_SERVICE_TOKEN }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail

          require() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Set ${name} in GitHub Environment 'production'."
              exit 1
            fi
          }

          for name in \
            DOMAIN LE_EMAIL SSH_HOST SSH_USER SSH_KNOWN_HOSTS \
            DB_HOST DB_NAME DB_USER DB_PASS ADMIN_PASSWORD SESSION_SECRET \
            EXPO_PUBLIC_YANDEX_MAPS_API_KEY RUSTORE_PUSH_PROJECT_ID; do
            require "$name"
          done

          if [ -z "$SSH_PRIVATE_KEY_B64" ] && [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Set SSH_PRIVATE_KEY_B64 (preferred) or SSH_PRIVATE_KEY as a production Secret."
            exit 1
          fi

          if [[ ! "$DOMAIN" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]] ||
             [[ "$DOMAIN" != *.* || "$DOMAIN" == *..* || "$DOMAIN" == www.* ]]; then
            echo "::error::DOMAIN must be an apex host name without scheme, path, or www: ${DOMAIN}"
            exit 1
          fi

          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == "/" || "$DEPLOY_PATH" == *".."* ]] ||
             [[ "$DEPLOY_PATH" =~ [^A-Za-z0-9_./-] ]]; then
            echo "::error::DEPLOY_PATH must be a safe absolute directory below /, got: ${DEPLOY_PATH}"
            exit 1
          fi

          for port_name in SSH_PORT CMS_PORT; do
            port="${!port_name}"
            if [[ ! "$port" =~ ^[0-9]+$ ]] || ((port < 1 || port > 65535)); then
              echo "::error::${port_name} must be an integer from 1 to 65535."
              exit 1
            fi
          done

          if ((${#SESSION_SECRET} < 32)); then
            echo "::error::SESSION_SECRET must contain at least 32 characters."
            exit 1
          fi

          if [ -z "$LASTFM_API_KEY" ]; then
            echo "::warning::LASTFM_API_KEY is not set; the scheduled Last.fm sync will not work."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cms/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix cms

      - name: Run preflight checks
        run: |
          # Validate against the SDK locked in this release, not newer patches from the registry.
          EXPO_OFFLINE=1 npx expo install --check
          npm run lint
          npm run typecheck
          npm run cms:typecheck
          npm run test:http-cache --prefix cms
          npm run test:ai
          npm run test:auth --prefix cms
          python3 scripts/test-release-transport.py
          npx tsx --test scripts/test-radio.ts
          npm run test:rustore-push-config
          npm run test:audit-fixes
          npm run test:sw
          npm run test:api-url
          npm run test:compat
          npm run test:map
          npm run test:map:renderer
          npm run test:map:layout
          npm run test:map:routing
          npm run test:push-reminders --prefix cms
          npm run test:admin --prefix cms
          node scripts/test-deployed-map.mjs
          npx tsx scripts/test-web-linking.mjs
          test -f deploy/setup-push-reminders-cron.sh
          for script in deploy/*.sh scripts/test-release-deploy.sh; do bash -n "$script"; done
          bash scripts/test-release-deploy.sh

      - name: Check direct web navigation with nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          node scripts/test-web-routes.mjs

      - name: Build and verify web app
        env:
          SEO_REQUIRE_LIVE_DATA: '1'
        run: |
          npm run build:web
          npm run seo:check
          node scripts/check-indexed-routes.mjs
          npm run test:push-web
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/manifest.webmanifest
          test -f dist/push-sw.js
          test -d dist/_expo/static/js/web
          find dist/assets -name 'Ionicons*.ttf' | grep -q .
          find dist/assets -name 'Montserrat_400Regular*.ttf' | grep -q .

      - name: Build and verify CMS
        run: |
          npm run build --prefix cms
          test -f cms/.next/BUILD_ID
          test -f cms/.next/standalone/server.js

      - name: Setup pinned SSH connection
        run: bash deploy/gha-setup-ssh.sh

      - name: Package release without environment files
        run: |
          tar --dereference --hard-dereference --exclude='cms/.env*' --exclude='cms/node_modules' --exclude='cms/.next/cache' \
            -czf release.tar.gz dist assets cms deploy shared

      - name: Transfer and activate release with restricted SSH
        run: python3 deploy/send-release.py release.tar.gz

      - name: Verify public production endpoints
        run: |
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN}/" -o "$RUNNER_TEMP/uletay-index.html"
          grep -qi '<html' "$RUNNER_TEMP/uletay-index.html"

          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            "https://${DOMAIN}/api/data" -o "$RUNNER_TEMP/uletay-api.json"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" \
            "$RUNNER_TEMP/uletay-api.json"
          node deploy/verify-map-data.mjs \
            "$RUNNER_TEMP/uletay-api.json" "cms/seed/content.json"
          node deploy/check-web-routes.mjs "https://${DOMAIN}"
          node deploy/check-public-resources.mjs "https://${DOMAIN}" "$GITHUB_SHA"
          node deploy/check-vk-headliners.mjs "https://vk-headliners.${DOMAIN}" "$GITHUB_SHA"

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- URL: https://${DOMAIN}/"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Web, CMS, SSH, database migration, and public HTTPS checks passed."
          } >> "$GITHUB_STEP_SUMMARY"
