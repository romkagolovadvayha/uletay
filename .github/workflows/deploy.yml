name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/var/www/uletay' }}
      LE_EMAIL: ${{ vars.LE_EMAIL || secrets.LE_EMAIL }}
      SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
      CMS_PORT: ${{ vars.CMS_PORT || secrets.CMS_PORT || '3000' }}
      ADMIN_USER: ${{ vars.ADMIN_USER || secrets.ADMIN_USER || 'admin' }}
      DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
      DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
      DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
      DB_PASS: ${{ vars.DB_PASS || secrets.DB_PASS }}
      ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ vars.SESSION_SECRET || secrets.SESSION_SECRET }}
      EXPO_PUBLIC_API_URL: https://${{ vars.DOMAIN || secrets.DOMAIN }}/api
      EXPO_PUBLIC_YANDEX_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_YANDEX_MAPS_API_KEY || secrets.EXPO_PUBLIC_YANDEX_MAPS_API_KEY }}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_YANDEX_MAPS_API_KEY || secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          require() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Set $name in GitHub Environment → production → Variables or Secrets"
              exit 1
            fi
          }

          require DOMAIN "$DOMAIN"
          require LE_EMAIL "$LE_EMAIL"
          require SSH_HOST "$SSH_HOST"
          require SSH_USER "$SSH_USER"
          require DB_HOST "$DB_HOST"
          require DB_NAME "$DB_NAME"
          require DB_USER "$DB_USER"
          require DB_PASS "$DB_PASS"
          require ADMIN_PASSWORD "$ADMIN_PASSWORD"

          if [ -z "${{ secrets.SSH_PRIVATE_KEY_B64 || vars.SSH_PRIVATE_KEY_B64 || secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}" ]; then
            echo "Set SSH_PRIVATE_KEY_B64 (recommended) or SSH_PRIVATE_KEY in Secrets"
            exit 1
          fi

          if [ -n "${{ vars.SSH_PRIVATE_KEY }}" ]; then
            echo "::warning::Remove SSH_PRIVATE_KEY from Variables — use Secrets or SSH_PRIVATE_KEY_B64 only"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build web app
        run: |
          npm run build
          test -f dist/index.html
          test -d dist/_expo/static/js/web
          find dist/assets -name 'Ionicons*.ttf' | grep -q .
          find dist/assets -name 'Montserrat_400Regular*.ttf' | grep -q .
        env:
          EXPO_PUBLIC_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_YANDEX_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_YANDEX_MAPS_API_KEY || secrets.EXPO_PUBLIC_YANDEX_MAPS_API_KEY }}

      - name: Build CMS
        run: |
          npm ci --prefix cms
          npm run build --prefix cms
          cp -r cms/.next/static cms/.next/standalone/.next/static
          mkdir -p cms/.next/standalone/data
          cp -r cms/data/. cms/.next/standalone/data/
          mkdir -p cms/.next/standalone/node_modules
          cp -a cms/node_modules/sharp cms/.next/standalone/node_modules/
          if [ -d cms/node_modules/@img ]; then
            cp -a cms/node_modules/@img cms/.next/standalone/node_modules/
          fi

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || vars.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 || vars.SSH_PRIVATE_KEY_B64 }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE || vars.SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/deploy_key"

          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            echo "Using SSH_PRIVATE_KEY_B64"
            B64=$(echo "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n \t')
            case $((${#B64} % 4)) in 2) B64="${B64}==" ;; 3) B64="${B64}=" ;; esac
            if ! echo "$B64" | openssl base64 -d -A > "$KEY_FILE" 2>/dev/null; then
              echo "$B64" | base64 -d > "$KEY_FILE"
            fi
            sed -i '1s/^\xEF\xBB\xBF//' "$KEY_FILE" 2>/dev/null || true
          elif [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "Using SSH_PRIVATE_KEY (prefer SSH_PRIVATE_KEY_B64)"
            if printf '%s' "$SSH_PRIVATE_KEY" | grep -q '\\n'; then
              printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
            else
              printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
            fi
          else
            echo "::error::No SSH key configured"
            exit 1
          fi
          chmod 600 "$KEY_FILE"

          KEY_SIZE=$(wc -c < "$KEY_FILE" | tr -d ' ')
          echo "Key file size: ${KEY_SIZE} bytes"

          if head -c 4 "$KEY_FILE" | grep -q '^ssh-'; then
            echo "::error::This looks like a .pub file. Encode the private key: base64 -w0 ~/.ssh/uletay_deploy"
            exit 1
          fi

          if ! ssh-keygen -y -f "$KEY_FILE" > "$HOME/.ssh/deploy_key.pub" 2>keygen.err; then
            echo "::error::SSH key is invalid."
            echo "Key header (hex):"
            head -c 32 "$KEY_FILE" | xxd || true
            echo "ssh-keygen says:"
            cat keygen.err || true
            if grep -qi 'passphrase\|decrypt\|bad decrypt' keygen.err 2>/dev/null; then
              echo "Key is password-protected. On server run:"
              echo "  bash deploy/print-github-ssh-key.sh"
            else
              echo "On server run:"
              echo "  bash deploy/print-github-ssh-key.sh"
              echo "Put the single b64 line in Secret SSH_PRIVATE_KEY_B64 only."
            fi
            exit 1
          fi

          ssh-keygen -y -f "$KEY_FILE" > "$HOME/.ssh/deploy_key.pub"
          echo "DEPLOY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "=== Add this line to /root/.ssh/authorized_keys on the server ==="
          cat "$HOME/.ssh/deploy_key.pub"
          echo "=== Target: ${SSH_USER}@${SSH_HOST}:${SSH_PORT} ==="

      - name: Verify SSH connection
        run: |
          ssh -i "$DEPLOY_KEY_FILE" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "echo SSH connection OK" \
            || (echo "SSH failed. On server run: cat ~/.ssh/uletay_ci.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys" && exit 1)

      - name: Sync files to server
        run: |
          RSYNC_SSH="ssh -i $DEPLOY_KEY_FILE -p $SSH_PORT -o StrictHostKeyChecking=accept-new"
          TARGET="${SSH_USER}@${SSH_HOST}:$DEPLOY_PATH"

          rsync -az --delete -e "$RSYNC_SSH" \
            --exclude '/node_modules' \
            --exclude '/cms/node_modules' \
            --exclude '/.git' \
            --exclude '/.expo' \
            --exclude '/uploads' \
            --exclude '/cms/.env' \
            ./ "$TARGET/"

      - name: Configure server (Node CMS + nginx + HTTPS)
        run: |
          ssh -i "$DEPLOY_KEY_FILE" -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "DOMAIN='$DOMAIN' \
             DEPLOY_PATH='$DEPLOY_PATH' \
             LE_EMAIL='$LE_EMAIL' \
             CMS_PORT='$CMS_PORT' \
             DB_HOST='$DB_HOST' \
             DB_NAME='$DB_NAME' \
             DB_USER='$DB_USER' \
             DB_PASS='$DB_PASS' \
             ADMIN_USER='$ADMIN_USER' \
             ADMIN_PASSWORD='$ADMIN_PASSWORD' \
             SESSION_SECRET='$SESSION_SECRET' \
             NEXT_PUBLIC_YANDEX_MAPS_API_KEY='${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}' \
             bash '$DEPLOY_PATH/deploy/remote-deploy.sh'"
