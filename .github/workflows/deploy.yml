name: Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/var/www/uletay' }}
      LE_EMAIL: ${{ vars.LE_EMAIL || secrets.LE_EMAIL }}
      SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
      CMS_PORT: ${{ vars.CMS_PORT || secrets.CMS_PORT || '3000' }}
      ADMIN_USER: ${{ vars.ADMIN_USER || secrets.ADMIN_USER || 'admin' }}
      DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
      DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
      DB_USER: ${{ vars.DB_USER || secrets.DB_USER }}
      DB_PASS: ${{ vars.DB_PASS || secrets.DB_PASS }}
      ADMIN_PASSWORD: ${{ vars.ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ vars.SESSION_SECRET || secrets.SESSION_SECRET }}
      EXPO_PUBLIC_API_URL: https://${{ vars.DOMAIN || secrets.DOMAIN }}/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          require() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Set $name in GitHub Environment → production → Variables or Secrets"
              exit 1
            fi
          }

          require DOMAIN "$DOMAIN"
          require LE_EMAIL "$LE_EMAIL"
          require SSH_HOST "$SSH_HOST"
          require SSH_USER "$SSH_USER"
          require DB_HOST "$DB_HOST"
          require DB_NAME "$DB_NAME"
          require DB_USER "$DB_USER"
          require DB_PASS "$DB_PASS"
          require ADMIN_PASSWORD "$ADMIN_PASSWORD"

          if [ -z "${{ vars.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Set SSH_PRIVATE_KEY in GitHub Environment → production → Variables or Secrets"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          EXPO_PUBLIC_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ vars.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ vars.SSH_PRIVATE_KEY_B64 || secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_KEY_PASSPHRASE: ${{ vars.SSH_KEY_PASSPHRASE || secrets.SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/deploy_key"

          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            echo "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_FILE"
          elif printf '%s' "$SSH_PRIVATE_KEY" | grep -q '\\n'; then
            printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" > "$HOME/.ssh/deploy_key.pub" 2>/dev/null; then
            echo "::error::SSH_PRIVATE_KEY is invalid (libcrypto)."
            echo "Do NOT use Variables for the key — only Secrets."
            echo "Recommended: set SSH_PRIVATE_KEY_B64 (base64 -w0 ~/.ssh/uletay_deploy on server)."
            echo "First line of key file:"
            head -n 1 "$KEY_FILE" || true
            exit 1
          fi

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          if ssh-add "$KEY_FILE" 2>/dev/null; then
            echo "SSH key loaded (no passphrase)."
          elif [ -n "$SSH_KEY_PASSPHRASE" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq expect
            expect <<EOF
          set timeout 10
          spawn ssh-add $env(HOME)/.ssh/deploy_key
          expect {
            "Enter passphrase" { send "$SSH_KEY_PASSPHRASE\r"; exp_continue }
            eof
          }
          EOF
          else
            echo "::error::ssh-add failed. Set SSH_KEY_PASSPHRASE or use a key without passphrase."
            exit 1
          fi

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "=== Public key (must be in server ~/.ssh/authorized_keys) ==="
          ssh-add -L
          echo "=== Target: ${SSH_USER}@${SSH_HOST}:${SSH_PORT} ==="

      - name: Verify SSH connection
        run: |
          ssh -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "echo SSH connection OK" \
            || (echo "SSH failed. Copy the public key from the previous step into /root/.ssh/authorized_keys on the server." && exit 1)

      - name: Sync files to server
        run: |
          RSYNC_SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new"
          TARGET="${SSH_USER}@${SSH_HOST}:$DEPLOY_PATH"

          rsync -az --delete -e "$RSYNC_SSH" \
            --exclude 'node_modules' \
            --exclude 'cms/node_modules' \
            --exclude 'cms/.next' \
            --exclude '.git' \
            --exclude '.expo' \
            --exclude 'uploads' \
            --exclude 'cms/.env' \
            ./ "$TARGET/"

      - name: Configure server (Node CMS + nginx + HTTPS)
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "DOMAIN='$DOMAIN' \
             DEPLOY_PATH='$DEPLOY_PATH' \
             LE_EMAIL='$LE_EMAIL' \
             CMS_PORT='$CMS_PORT' \
             DB_HOST='$DB_HOST' \
             DB_NAME='$DB_NAME' \
             DB_USER='$DB_USER' \
             DB_PASS='$DB_PASS' \
             ADMIN_USER='$ADMIN_USER' \
             ADMIN_PASSWORD='$ADMIN_PASSWORD' \
             SESSION_SECRET='$SESSION_SECRET' \
             bash '$DEPLOY_PATH/deploy/remote-deploy.sh'"
