name: Sync headliner web images
'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no DB or file writes)
        type: boolean
        default: false
      force:
        description: Replace existing images
        type: boolean
        default: false
      limit:
        description: Max groups to process (empty = all)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: uletay-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Setup pinned SSH connection
      run: bash deploy/gha-setup-ssh.sh
    - name: Run maintenance in the active production release
      env:
        MAINTENANCE_OPTIONS: ${{ toJSON(inputs) }}
      run: |
        if [ -z "$MAINTENANCE_OPTIONS" ] || [ "$MAINTENANCE_OPTIONS" = "null" ]; then
          MAINTENANCE_OPTIONS='{}'
        fi
        printf '%s\n' "$MAINTENANCE_OPTIONS" | ssh -T -i "$DEPLOY_KEY_FILE" -p "$SSH_PORT" \
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
          -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=15 \
          "${SSH_USER}@${SSH_HOST}" sync-images
