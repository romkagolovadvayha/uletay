<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Страница не найдена — УЛЕТАЙ 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Montserrat, system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: min(100%, 480px);
      text-align: center;
    }

    .code {
      margin: 0 0 12px;
      font-size: clamp(72px, 18vw, 120px);
      font-weight: 700;
      line-height: 1;
      color: #ffc107;
      letter-spacing: -0.04em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 700;
    }

    p {
      margin: 0 0 28px;
      color: #aeaeb2;
      font-size: 16px;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 28px;
      border-radius: 999px;
      background: #ffc107;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    a:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Страница не найдена</h1>
    <p>Такой страницы на сайте фестиваля нет. Проверьте адрес или вернитесь на главную.</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
