appId: ru.uletay.app
name: Artist and popular tracks
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: 'Увидимся на Улетай 2027'
    timeout: 60000
- openLink: uletay://headliners/hl-%D0%BC%D0%B5%D0%BB%D1%8C%D0%BD%D0%B8%D1%86%D0%B0
- tapOn:
    text: 'Open|Открыть'
    optional: true
- extendedWaitUntil:
    visible: '(?i).*Мельница.*'
    timeout: 30000
- takeScreenshot: 04-artist
- scrollUntilVisible:
    element:
      text: '(?i)Популярные треки'
    direction: DOWN
    timeout: 30000
    centerElement: true
- takeScreenshot: 04-artist-tracks
