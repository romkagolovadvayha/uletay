appId: ru.uletay.app
name: Guest home and line-up
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: '.*2027.*'
    timeout: 60000
- takeScreenshot: 00-home
- openLink: uletay://headliners
- tapOn:
    text: 'Open|Открыть'
    optional: true
- extendedWaitUntil:
    visible: '(?i)Лайн-ап'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-lineup
