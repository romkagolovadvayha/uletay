appId: ru.uletay.app
name: Guest festival journey and optional authentication
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: '.*2027.*'
    timeout: 60000
- takeScreenshot: 00-home
- openLink: uletay://headliners
- tapOn:
    text: 'Open|Открыть'
    optional: true
- extendedWaitUntil:
    visible: '.*2027.*'
    timeout: 30000
- takeScreenshot: 01-lineup
- openLink: uletay://chat
- extendedWaitUntil:
    visible: 'Общий чат'
    timeout: 30000
- takeScreenshot: 02-chat
- tapOn: 'Сообщение в общий чат'
- assertVisible: 'Войти в Улетай'
- takeScreenshot: 07-optional-apple-login
- launchApp:
    stopApp: true
- openLink: uletay://wishes
- extendedWaitUntil:
    visible: 'Кого ждём\?'
    timeout: 30000
- takeScreenshot: 03-wishes
- openLink: uletay://headliners/hl-%D0%BC%D0%B5%D0%BB%D1%8C%D0%BD%D0%B8%D1%86%D0%B0
- extendedWaitUntil:
    visible: '.*Мельница.*'
    timeout: 30000
- takeScreenshot: 04-artist
- swipe:
    direction: UP
- takeScreenshot: 04-artist-tracks
- openLink: uletay://map
- extendedWaitUntil:
    visible: 'Карта фестиваля'
    timeout: 45000
- takeScreenshot: 05-map
- openLink: uletay://schedule
- takeScreenshot: 06-schedule-unpublished
- openLink: uletay://settings
- tapOn: 'Демо фестиваля'
- openLink: uletay://schedule
- takeScreenshot: 06-schedule-demo
- swipe:
    direction: LEFT
- takeScreenshot: 06-schedule-demo-after-swipe
- openLink: uletay://settings
- tapOn: 'Текущее время'
