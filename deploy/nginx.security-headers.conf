# Shared production security policy. Keep external origins aligned with the
# Expo app integrations (Yandex Maps/Metrika, Google Analytics and radio).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://mc.yandex.ru https://mc.yandex.com https://api-maps.yandex.ru https://yastatic.net https://*.yastatic.net https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://uletayradio.hostingradio.ru; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://api-maps.yandex.ru https://yandex.ru https://*.yandex.ru https://*.yandex.net https://yastatic.net https://*.yastatic.net https://cdn.jsdelivr.net https://router.project-osrm.org https://api.routing.yandex.net https://uletayradio.hostingradio.ru wss:; worker-src 'self' blob:; child-src 'self' blob: https://yandex.ru https://*.yandex.ru; frame-src 'self' https://yandex.ru https://*.yandex.ru; manifest-src 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
