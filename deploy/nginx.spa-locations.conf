error_page 404 /404.html;

# Versioned MapLibre ESM and worker assets require a JavaScript MIME type.
location ^~ /vendor/maplibre/ {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    types { application/javascript mjs js; text/css css; text/plain txt; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

location = /404.html {
    root __DEPLOY_PATH__/dist;
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

# Service workers and HTML must not be cached long-term, or clients stick on old builds.
location = /sw.js {
    root __DEPLOY_PATH__/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

location = /push-sw.js {
    root __DEPLOY_PATH__/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

location = /index.html {
    return 301 /;
}

location = /more {
    return 301 /;
}

location = /more/ {
    return 301 /;
}

# One canonical URL per public app document; leave API/admin paths untouched.
location ~ ^/(map|schedule|autographs|favorites|playlist|headliners|foodcourt|about|rules|settings|legal|help)(/.*)?/$ {
    return 301 $spa_canonical_uri;
}

location = /manifest.webmanifest {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    default_type application/manifest+json;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

# LCP poster and other root static files (not under /assets/ or /_expo/).
location = /hero-video-poster.webp {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

location ~* ^/[^/]+\.(webp|png|jpe?g|gif|ico|svg|woff2?|ttf)$ {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

location = / {
    root __DEPLOY_PATH__/dist;
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Link "</hero-video-poster.webp>; rel=preload; as=image; fetchpriority=high" always;
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

location / {
    root __DEPLOY_PATH__/dist;
    index index.html;
    try_files $seo_static_uri/index.html $seo_static_uri $uri/index.html $uri @spa;
    # Store HTML but revalidate it on every navigation so new JS hashes deploy safely.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
}

location @spa {
    root __DEPLOY_PATH__/dist;
    if ($is_spa_route = 0) {
        return 404;
    }
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include __DEPLOY_PATH__/deploy/nginx.security-headers.conf;
    rewrite ^ /index.html break;
}
