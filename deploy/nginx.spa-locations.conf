error_page 404 /404.html;

location = /404.html {
    root __DEPLOY_PATH__/dist;
    internal;
}

location / {
    root __DEPLOY_PATH__/dist;
    index index.html;
    try_files $uri $uri/ @spa;
}

location @spa {
    root __DEPLOY_PATH__/dist;
    if ($is_spa_route = 0) {
        return 404;
    }
    rewrite ^ /index.html break;
}
