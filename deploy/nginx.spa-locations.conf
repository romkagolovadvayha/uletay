error_page 404 /404.html;

location = /404.html {
    root __DEPLOY_PATH__/dist;
    internal;
}

# LCP poster and other root static files (not under /assets/ or /_expo/).
location = /hero-video-poster.webp {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location ~* ^/[^/]+\.(webp|png|jpe?g|gif|ico|svg|woff2?|ttf)$ {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location / {
    root __DEPLOY_PATH__/dist;
    index index.html;
    try_files $uri $uri/ @spa;
}

location @spa {
    root __DEPLOY_PATH__/dist;
    if ($is_spa_route = 0) {
        return 404;
    }
    rewrite ^ /index.html break;
}
