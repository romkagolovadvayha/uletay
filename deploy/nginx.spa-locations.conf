error_page 404 /404.html;

location = /404.html {
    root __DEPLOY_PATH__/dist;
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Service workers and HTML must not be cached long-term, or clients stick on old builds.
location = /sw.js {
    root __DEPLOY_PATH__/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
}

location = /push-sw.js {
    root __DEPLOY_PATH__/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
}

location = /index.html {
    root __DEPLOY_PATH__/dist;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /more {
    return 301 /;
}

location = /more/ {
    return 301 /;
}

# LCP poster and other root static files (not under /assets/ or /_expo/).
location = /hero-video-poster.webp {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location ~* ^/[^/]+\.(webp|png|jpe?g|gif|ico|svg|woff2?|ttf)$ {
    root __DEPLOY_PATH__/dist;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location / {
    root __DEPLOY_PATH__/dist;
    index index.html;
    try_files $seo_static_uri/index.html $seo_static_uri $uri/index.html $uri @spa;
    # HTML shell: always revalidate so phones pick up new JS hashes after deploy.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location @spa {
    root __DEPLOY_PATH__/dist;
    if ($is_spa_route = 0) {
        return 404;
    }
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    rewrite ^ /index.html break;
}
