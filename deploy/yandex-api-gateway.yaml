openapi: 3.0.0
info:
  title: Uletay API fallback
  version: 1.0.0
x-yc-apigateway:
  cors:
    origin: "*"
    methods: [GET, HEAD, POST, DELETE, OPTIONS]
    allowedHeaders: [Content-Type, Authorization, Accept, If-None-Match, X-Chat-CSRF]
    exposedHeaders: [ETag, Retry-After]
    maxAge: 600
paths:
  /health:
    get:
      operationId: uletayGatewayHealth
      responses:
        "200":
          description: Gateway connectivity probe
      x-yc-apigateway-integration:
        type: dummy
        http_code: 200
        http_headers:
          Content-Type: application/json
          Cache-Control: no-store
        content:
          application/json: '{"ok":true,"service":"uletay-gateway"}'
  /api/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: Uletay API response
      x-yc-apigateway-integration:
        type: http
        url: https://uletayapp.ru/api/{path}
        headers:
          "*": "*"
          Host: ""
          Cookie: ""
          Origin: ""
          Connection: ""
          Content-Length: ""
          Accept-Encoding: ""
          X-Forwarded-For: ""
          X-Real-IP: ""
          X-Forwarded-Host: ""
          X-Forwarded-Proto: ""
        query:
          "*": "*"
        omitEmptyHeaders: true
        timeouts:
          connect: 3
          read: 20
