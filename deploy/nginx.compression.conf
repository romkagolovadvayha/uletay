# gzip is available in the stock nginx build. Do not enable Brotli here unless
# the optional Brotli module is installed, otherwise nginx -t will fail.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.api+json
    application/wasm
    application/xml
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
